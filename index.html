<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCEL OnePay Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap');

        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f3f4f6;
        }

        .qr-image {
            width: 260px;
            height: 260px;
            object-fit: contain;
        }

        .checking-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            border-radius: 1rem;
        }
    </style>
</head>
<body>
    <div id="loginSection" class="min-h-screen flex items-center justify-center px-4">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-blue-600 uppercase">OnePay Shop</h2>
                <p class="text-gray-500">กรอกรหัสพนักงาน 12 หลัก</p>
            </div>
            <div class="space-y-4">
                <input type="text" id="activationCode" maxlength="12" placeholder="000000000000"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-center text-xl tracking-widest">
                <button onclick="handleLogin()" id="btnLogin"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition">เข้าสู่ระบบ</button>
                <p id="loginStatus" class="text-center text-sm text-red-500 font-medium"></p>
            </div>
        </div>
    </div>

    <div id="dashboard" class="hidden min-h-screen p-4 md:p-8">
        <div class="max-w-5xl mx-auto">
            <div class="bg-blue-600 rounded-2xl p-6 text-white mb-6 shadow-lg flex justify-between items-center">
                <div>
                    <h1 id="merchantName" class="text-xl font-bold">---</h1>
                    <p id="staffInfo" class="opacity-80 text-sm">Staff: ---</p>
                </div>
                <button onclick="logout()"
                    class="bg-white/20 hover:bg-white/30 px-4 py-2 rounded-lg text-sm">ออกจากระบบ</button>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="bg-white rounded-2xl p-6 shadow-md relative overflow-hidden">
                    <h3 class="text-lg font-bold mb-4 border-b pb-2 uppercase text-gray-700">สร้าง QR รับชำระ</h3>

                    <div id="paymentStatusOverlay" class="checking-overlay hidden">
                        <div class="text-center p-6 w-full flex flex-col items-center">
                            <div id="qrcodeInOverlay"
                                class="bg-white p-4 rounded-2xl shadow-lg mb-4 border-4 border-blue-500">
                            </div>

                            <p class="text-blue-600 font-bold text-lg">สแกนเพื่อชำระเงิน</p>
                            <p id="timerDisplay" class="text-red-500 text-3xl font-mono my-2 font-bold">05:00</p>
                            <p id="targetAmountDisplay" class="text-gray-700 font-bold text-xl mb-4">ยอด: 0 LAK</p>

                            <div class="flex flex-col gap-2 w-64">
                                <button onclick="manualVerify()"
                                    class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 shadow-md">เช็คยอดทันที</button>
                                <button onclick="cancelPayment()"
                                    class="w-full text-gray-500 text-sm py-2 hover:text-red-500 transition underline">ยกเลิกรายการนี้</button>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-gray-600 mb-1 font-medium">จำนวนเงิน (LAK)</label>
                            <input type="number" id="amountInput" placeholder="0.00"
                                class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-2xl font-bold text-blue-600">
                        </div>
                        <button onclick="generateQR()" id="btnGenerate"
                            class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-xl transition shadow-lg">สร้างคิวอาร์โค้ด</button>

                        <div id="qrcodeContainer"
                            class="flex flex-col items-center justify-center p-6 bg-gray-50 rounded-2xl border-2 border-dashed border-gray-200 min-h-[320px]">
                            <div id="qrcodeDisplay" class="bg-white p-2 rounded-lg shadow-sm hidden"></div>
                            <div id="qrPlaceholder" class="text-gray-400 text-center">
                                <p>พร้อมสร้างคิวอาร์โค้ด</p>
                            </div>
                            <p id="qrText" class="mt-4 text-[10px] text-gray-300 break-all text-center"></p>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl p-6 shadow-md border border-gray-100">
                    <div class="flex justify-between items-center mb-4 border-b pb-2">
                        <h3 class="text-lg font-bold uppercase text-gray-700">ประวัติ 10 รายการล่าสุด</h3>
                        <button onclick="loadHistory()"
                            class="text-blue-600 text-sm font-medium hover:underline">รีเฟรช</button>
                    </div>
                    <div id="historyList" class="space-y-3 overflow-y-auto max-h-[500px]">
                        <p class="text-center text-gray-400 py-10">กำลังโหลด...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        // const API_BASE = 'http://localhost:3000/api'; api nodejs
        const API_BASE = 'api/onepayshop/?action=';
        const CONFIG = {
            deviceId: "a9076de11285be7cc650cc8c5bbf2825e8d3ba505eeb01f9269f74e32b3cef61",
            pushId: "dOP7K9z7TX-PfOdsKDUGbR:APA91bHp-IBFowscYsYXMwW2NSZuk8npXwyz7j3MvBQ7bjLFTXvsEwVMLQipjO4JyxHofeCQex0T4jJSONlbm6GBN8fXO_WzvYCjiTWNexE3PNUiQlibcR0",
            publicKey: "3059301306072a8648ce3d020106082a8648ce3d0301070342000461ffa20769d3e05eb6989eb7d558a37d00d363b1fc9256f1715f837df400489c43e7ec507265e54fd61dc367d3daad078106638094ec959d3cb3ac8423801aa4",
            regSignature: "304402200eddc844ec9b6cbcf6cf4251e8b3b35ce97a6fd77b01638c72a2606ac725ceea02201b199c576ea53156858563a7659bb23cea8cd31c0eee4e6cdf04e18bcd32431f",
            actSignature: "30450221009f00e4e08649de570815876309b9daf2ec02ead88fcd12fc2d70cb303ce21c6502205408cd941e5e9947e47afb525932198ec66391dbb2bbeacc731d8986efdf74d0",
            infoSignature: "3045022019d2a7831f2f95e548bd17e4d12a54dd20ac6d4cb9c89bcd48729624f9bb187a022100c7f83768ac7ce55dd6e486a5d3c4a09c9b2869af839713c72b7d1c393011e16c",
            histSignature: "30450221009bba53e63e02615ef5e563dc70b510b3844d0159ce775974803620fa3466f51e022016fc1cb95d243f5453dddc0199992477bf097726ebacef7737ad25c7d594c8a4"
        };

        let merchantData = null;
        let checkInterval = null;
        let countdownInterval = null;
        let currentTargetAmount = 0;

        window.onload = () => {
            const saved = localStorage.getItem('onepay_merchant');
            if (saved) { merchantData = JSON.parse(saved); showDashboard(); }
        };

        async function handleLogin() {
            const code = document.getElementById('activationCode').value;
            if (code.length !== 12) return alert('กรุณากรอกรหัสพนักงานให้ครบ 12 หลัก');
            const btn = document.getElementById('btnLogin');
            btn.disabled = true; btn.innerText = 'กำลังตรวจสอบ...';
            try {
                const regRes = await fetch(`${API_BASE}register`, { method: 'POST', headers: { 'Content-Type': 'application/json' } });
                const regData = await regRes.json();
                const actRes = await fetch(`${API_BASE}activate`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ activationcode: code, devicetoken: regData.token || "" }) });
                if (!actRes.ok) throw new Error("รหัสไม่ถูกต้อง");
                const infoRes = await fetch(`${API_BASE}info`, { method: 'POST', headers: { 'Content-Type': 'application/json' } });
                const infoData = await infoRes.json();
                if (infoData && infoData.length > 0) {
                    merchantData = infoData[0];
                    localStorage.setItem('onepay_merchant', JSON.stringify(merchantData));
                    showDashboard();
                }
            } catch (err) { alert(err.message); } finally { btn.disabled = false; btn.innerText = 'เข้าสู่ระบบ'; }
        }

        function showDashboard() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('merchantName').innerText = merchantData.merchantName;
            document.getElementById('staffInfo').innerText = `Staff: ${merchantData.staffName} | TID: ${merchantData.terminalId}`;
            loadHistory();
        }

        async function generateQR() {
            const amount = document.getElementById('amountInput').value;
            if (!amount || amount <= 0) return alert("ระบุยอดเงินที่ต้องการ");
            currentTargetAmount = amount;

            try {
                const res = await fetch(`${API_BASE}generate-qr`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mcid: merchantData.mcid, merchantName: merchantData.merchantEnglishName || merchantData.merchantName, terminalId: merchantData.terminalId, amount }) });
                const data = await res.json();
                if (data.qr_string) {
                    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(data.qr_string)}`;
                    const qrImgHtml = `<img src="${qrUrl}" class="qr-image" alt="OnePay QR">`;

                    document.getElementById('qrcodeDisplay').innerHTML = qrImgHtml;
                    document.getElementById('qrcodeDisplay').classList.remove('hidden');
                    document.getElementById('qrPlaceholder').classList.add('hidden');
                    document.getElementById('qrcodeInOverlay').innerHTML = qrImgHtml;
                    document.getElementById('qrText').innerText = data.qr_string;
                    startPaymentCheck(amount);
                }
            } catch (err) { alert('สร้าง QR ล้มเหลว'); }
        }

        function startPaymentCheck(amount) {
            cancelPayment(false);
            document.getElementById('paymentStatusOverlay').classList.remove('hidden');
            document.getElementById('targetAmountDisplay').innerText = `ยอด: ${parseFloat(amount).toLocaleString()} LAK`;

            let timeLeft = 300;
            countdownInterval = setInterval(() => {
                timeLeft--;
                let mins = Math.floor(timeLeft / 60);
                let secs = timeLeft % 60;
                document.getElementById('timerDisplay').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                if (timeLeft <= 0) { alert("หมดเวลาทำรายการ"); cancelPayment(true); }
            }, 1000);

            checkInterval = setInterval(() => manualVerify(true), 5000);
        }

        async function manualVerify(isAuto = false) {
            try {
                const res = await fetch(`${API_BASE}verify-payment`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mcid: merchantData.mcid, targetAmount: currentTargetAmount }) });
                const result = await res.json();
                if (result.success) {
                    alert(`สำเร็จ! ได้รับเงิน ${parseFloat(currentTargetAmount).toLocaleString()} LAK`);
                    cancelPayment(true);
                    loadHistory();
                } else if (!isAuto) {
                    alert("ยังไม่พบยอดเงินเข้ามา");
                }
            } catch (e) { console.error(e); }
        }

        function cancelPayment(resetAll = true) {
            clearInterval(checkInterval);
            clearInterval(countdownInterval);
            if (resetAll) {
                document.getElementById('paymentStatusOverlay').classList.add('hidden');
                document.getElementById('qrcodeDisplay').classList.add('hidden');
                document.getElementById('qrcodeInOverlay').innerHTML = '';
                document.getElementById('qrPlaceholder').classList.remove('hidden');
                document.getElementById('qrText').innerText = '';
                document.getElementById('amountInput').value = '';
            }
        }

        async function loadHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '<p class="text-center text-gray-400 py-10">กำลังโหลด...</p>';
            try {
                const res = await fetch(`${API_BASE}history`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mcid: merchantData.mcid }) });
                const data = await res.json();
                list.innerHTML = '';
                if (!data.histories || data.histories.length === 0) {
                    list.innerHTML = '<p class="text-center text-gray-400 py-10">ไม่พบประวัติการทำรายการ</p>';
                    return;
                }
                data.histories.slice(0, 10).forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'flex justify-between items-center p-3 border rounded-xl hover:bg-gray-50 transition';
                    div.innerHTML = `<div><p class="font-bold text-gray-800">${item.name || 'ลูกค้าทั่วไป'}</p><p class="text-[10px] text-gray-400">${item.txtime}</p></div><div class="text-right"><p class="font-bold text-blue-600">${parseFloat(item.amount).toLocaleString()} LAK</p></div>`;
                    list.appendChild(div);
                });
            } catch (err) { list.innerHTML = '<p class="text-red-500 text-center py-10">โหลดไม่สำเร็จ</p>'; }
        }

        function logout() { localStorage.removeItem('onepay_merchant'); window.location.reload(); }
    </script>
</body>
</html>
